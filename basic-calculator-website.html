<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131c">
<title>Calc — Simple Calculator</title>
<style>
:root{color-scheme:dark;--bg:#0b0e15;--panel:#151a25;--panel2:#1d2432;--text:#f4f6fb;--muted:#929bad;--accent:#8b9cff;--accent2:#687cf5;--line:rgba(255,255,255,.07)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#202a46 0%,#101522 38%,var(--bg) 78%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.wrap{width:min(100%,390px)}
.brand{display:flex;align-items:center;justify-content:space-between;margin:0 4px 16px}
.brand h1{font-size:15px;letter-spacing:.16em;text-transform:uppercase;margin:0;font-weight:750}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.08em}
.calculator{background:linear-gradient(160deg,rgba(28,34,49,.98),rgba(17,21,31,.98));border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 28px 80px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.05)}
.display{height:142px;padding:14px 8px 18px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;overflow:hidden}
.expression{width:100%;min-height:24px;text-align:right;color:var(--muted);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result{max-width:100%;font-size:clamp(38px,11vw,54px);font-weight:570;letter-spacing:-.055em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:67px;border:0;border-radius:18px;background:var(--panel2);color:var(--text);font:500 22px inherit;font-size:22px;cursor:pointer;transition:transform .12s,filter .12s,background .12s;box-shadow:inset 0 1px rgba(255,255,255,.045);-webkit-tap-highlight-color:transparent}
button:hover{filter:brightness(1.16)}button:active{transform:scale(.96)}
button.utility{background:#252d3d;color:#c3ccdf;font-size:18px}
button.operator{background:rgba(112,132,255,.15);color:#aab6ff;font-size:25px}
button.equals{background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff;font-size:27px;box-shadow:0 8px 22px rgba(104,124,245,.24)}
button.zero{grid-column:span 2;text-align:left;padding-left:27px}
.footer{text-align:center;color:#758096;font-size:11px;margin:16px 0 0;letter-spacing:.04em}
@media(max-width:360px){.calculator{padding:14px;border-radius:23px}.keys{gap:8px}button{height:60px;border-radius:15px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="brand"><h1>CALC<span style="color:var(--accent)">.</span></h1><span>YOUR EVERYDAY TOOL</span></header>
  <section class="calculator" aria-label="Calculator">
    <div class="display" aria-live="polite" aria-atomic="true">
      <div class="expression" id="expression"></div>
      <div class="result" id="display">0</div>
    </div>
    <div class="keys">
      <button class="utility" data-action="clear" aria-label="All clear">AC</button>
      <button class="utility" data-action="delete" aria-label="Delete last digit">⌫</button>
      <button class="utility" data-action="percent" aria-label="Percent">%</button>
      <button class="operator" data-op="÷" aria-label="Divide">÷</button>

      <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button>
      <button class="operator" data-op="×" aria-label="Multiply">×</button>

      <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button>
      <button class="operator" data-op="−" aria-label="Subtract">−</button>

      <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button>
      <button class="operator" data-op="+" aria-label="Add">+</button>

      <button class="zero" data-num="0">0</button><button data-action="decimal">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </section>
  <p class="footer">A little clarity in every calculation.</p>
</main>
<script>
(() => {
  const display = document.getElementById('display');
  const expression = document.getElementById('expression');
  let current = '0', previous = null, operator = null, waiting = false, justEvaluated = false;

  const render = () => { display.textContent = current; };
  const format = n => {
    if (!Number.isFinite(n)) return 'Error';
    const rounded = Number.parseFloat(n.toPrecision(12));
    return String(rounded);
  };
  const calculate = (a,b,op) => {
    switch(op) {
      case '+': return a+b;
      case '−': return a-b;
      case '×': return a*b;
      case '÷': return b===0 ? NaN : a/b;
      default: return b;
    }
  };
  function inputDigit(d) {
    if (current === 'Error' || waiting || justEvaluated) {
      current = d; waiting = false; justEvaluated = false;
    } else if (current.length < 14) current = current === '0' ? d : current + d;
    render();
  }
  function chooseOperator(op) {
    if (current === 'Error') return;
    const value = Number(current);
    if (operator && !waiting) {
      const result = calculate(previous, value, operator);
      current = format(result); render(); previous = result;
    } else previous = value;
    operator = op; waiting = true; justEvaluated = false;
    expression.textContent = `${format(previous)} ${op}`;
  }
  function equals() {
    if (!operator || previous === null || current === 'Error') return;
    const a = previous, b = Number(current), op = operator;
    const result = calculate(a,b,op);
    expression.textContent = `${format(a)} ${op} ${format(b)} =`;
    current = format(result); previous = null; operator = null;
    waiting = true; justEvaluated = true; render();
  }
  function clear() { current='0'; previous=null; operator=null; waiting=false; justEvaluated=false; expression.textContent=''; render(); }
  function del() {
    if (current === 'Error' || waiting || justEvaluated) { current='0'; waiting=false; justEvaluated=false; }
    else current = current.length > 1 ? current.slice(0,-1) : '0';
    render();
  }
  function percent() {
    if (current === 'Error') return;
    current = format(Number(current)/100); render();
  }
  function decimal() {
    if (current === 'Error' || waiting || justEvaluated) { current='0.'; waiting=false; justEvaluated=false; }
    else if (!current.includes('.')) current += '.';
    render();
  }
  document.querySelector('.keys').addEventListener('click', e => {
    const b=e.target.closest('button'); if(!b) return;
    if (b.dataset.num !== undefined) inputDigit(b.dataset.num);
    else if (b.dataset.op) chooseOperator(b.dataset.op);
    else ({clear,delete:del,percent,decimal,equals}[b.dataset.action] || (()=>{}))();
  });
  document.addEventListener('keydown', e => {
    if (/^[0-9]$/.test(e.key)) inputDigit(e.key);
    else if (e.key === '.') decimal();
    else if (e.key === '+') chooseOperator('+');
    else if (e.key === '-') chooseOperator('−');
    else if (e.key === '*') chooseOperator('×');
    else if (e.key === '/') { e.preventDefault(); chooseOperator('÷'); }
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
    else if (e.key === 'Backspace') del();
    else if (e.key === 'Escape') clear();
    else if (e.key === '%') percent();
  });
  render();
})();
</script>
</body>
</html>
